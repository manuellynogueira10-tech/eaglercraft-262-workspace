name: Minecraft 26.3 source inventory tests
on:
  push:
    branches:
      - feature/minecraft-26-3-web
    paths:
      - 'tools/check_263_input.py'
      - 'tests/test_check_263_input.py'
      - '.github/workflows/port-26-3-preflight.yml'
  pull_request:
    paths:
      - 'tools/check_263_input.py'
      - 'tests/test_check_263_input.py'
      - '.github/workflows/port-26-3-preflight.yml'
  workflow_dispatch:

jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local source detector without Mojang files
        run: python3 -m unittest discover -s tests -p 'test_check_263_input.py' -v
